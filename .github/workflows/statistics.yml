name: Archive download statistics

on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: download-statistics
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'Adkid-Zephyr/anti-defensive-writing-Skill'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Check traffic credential
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo '::error::Set TRAFFIC_TOKEN with repository Administration: read permission. See docs/statistics.md.'
            exit 1
          fi
      - name: Test collector
        run: python3 -m unittest discover -s tests -v
      - name: Collect aggregate GitHub counts
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: python3 scripts/collect_stats.py
      - name: Save statistics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stats/history.json stats/README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: archive GitHub download statistics'
          git push origin HEAD:"${{ github.event.repository.default_branch }}"
